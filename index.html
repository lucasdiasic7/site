<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>Contagem · Aniversário</title>
  <style>
    :root { color-scheme: dark; --accent: #b8ff5c; --muted: #a5a8b2; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; background: #08090d; color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid; place-items: center; overflow: hidden;
    }
    .background { position: fixed; inset: 0; z-index: -3; background: radial-gradient(ellipse at center, #22251d 0%, #090a0e 62%, #030406 100%); }
    video { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: .42; filter: saturate(.85) contrast(1.12); }
    .shade { position: fixed; inset: 0; z-index: -2; background: linear-gradient(90deg, rgba(3,4,7,.84), rgba(3,4,7,.38), rgba(3,4,7,.82)); }
    .grain { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .1; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E"); }
    main { width: min(920px, 92vw); text-align: center; padding: 42px 18px 54px; }
    .sound { position: fixed; top: 20px; right: 20px; border: 1px solid #ffffff35; border-radius: 999px; padding: 11px 15px; color: white; background: #11141ac9; cursor: pointer; font-size: 12px; letter-spacing: .13em; }
    .eyebrow { font-size: 12px; letter-spacing: .42em; color: var(--accent); text-transform: uppercase; font-weight: 700; }
    h1 { margin: 22px 0 8px; font-size: clamp(38px, 8vw, 76px); line-height: .98; letter-spacing: -.055em; text-transform: uppercase; text-shadow: 0 0 35px #b8ff5c18; }
    .subtitle { color: var(--muted); font-size: clamp(12px, 2vw, 15px); letter-spacing: .18em; text-transform: uppercase; }
    .status { margin: 38px auto 26px; font-size: clamp(13px, 2vw, 17px); color: #d9dbe0; letter-spacing: .3em; text-transform: uppercase; }
    .timer { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 2vw, 18px); margin: 0 auto; max-width: 760px; }
    .unit { padding: 23px 8px 19px; border: 1px solid #ffffff21; background: #080a0dcc; backdrop-filter: blur(10px); position: relative; }
    .unit::before { content: ""; position: absolute; top: -1px; left: 20%; right: 20%; height: 2px; background: var(--accent); box-shadow: 0 0 16px #b8ff5c60; }
    .number { display: block; font-size: clamp(34px, 7vw, 66px); line-height: 1.1; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.05em; }
    .label { display: block; margin-top: 12px; font-size: 10px; color: var(--muted); letter-spacing: .22em; }
    .progress-wrap { max-width: 760px; margin: 27px auto 0; }
    .progress-info { display: flex; justify-content: space-between; color: #a5a8b2; font-size: 10px; letter-spacing: .16em; }
    .track { height: 3px; background: #ffffff1b; margin-top: 10px; overflow: hidden; }
    .bar { height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 14px var(--accent); transition: width .5s; }
    .footer { margin-top: 48px; font-size: 10px; color: #8b8e98; letter-spacing: .2em; text-transform: uppercase; }
    .birthday h1 { color: var(--accent); font-size: clamp(34px, 7.5vw, 72px); }
    .birthday .status { color: var(--accent); font-weight: 800; letter-spacing: .15em; font-size: clamp(18px, 3vw, 28px); }
    .birthday .unit { border-color: #b8ff5c55; }
    .birthday .number { color: var(--accent); }
    @media (max-width: 520px) { .timer { grid-template-columns: repeat(2, 1fr); } .unit { padding: 17px 8px; } .footer { margin-top: 34px; } }
  </style>
</head>
<body>
  <div class="background">
    <!-- Coloque bills.mp4 na mesma pasta deste arquivo para usar o vídeo de fundo. -->
    <video id="bgVideo" autoplay muted loop playsinline preload="auto">
      <source src="bills.mp4" type="video/mp4">
    </video>
  </div>
  <div class="shade"></div><div class="grain"></div>
  <button class="sound" id="soundBtn" type="button">♪ ATIVAR SOM</button>
  <main id="main">
    <div class="eyebrow">ARQUIVO TEMPORAL // 13.12</div>
    <h1 id="headline">CONTAGEM</h1>
    <div class="subtitle">O próximo ciclo está se aproximando</div>
    <div class="status" id="status">FALTA</div>
    <section class="timer" aria-label="Contagem regressiva">
      <div class="unit"><span class="number" id="days">00</span><span class="label">DIAS</span></div>
      <div class="unit"><span class="number" id="hours">00</span><span class="label">HORAS</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="label">MINUTOS</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="label">SEGUNDOS</span></div>
    </section>
    <div class="progress-wrap">
      <div class="progress-info"><span id="progressLabel">PROGRESSO DO CICLO</span><span id="percent">0%</span></div>
      <div class="track"><div class="bar" id="bar"></div></div>
    </div>
    <div class="footer" id="footer">O TEMPO NÃO ESPERA NINGUÉM</div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const video = $('bgVideo');
    $('soundBtn').addEventListener('click', async () => {
      video.muted = !video.muted;
      $('soundBtn').textContent = video.muted ? '♪ ATIVAR SOM' : '♪ DESATIVAR SOM';
      if (!video.paused) return;
      try { await video.play(); } catch (_) {}
    });

    const pad = n => String(n).padStart(2, '0');
    function update() {
      const now = new Date();
      const isBirthday = now.getMonth() === 11 && now.getDate() === 13;
      if (isBirthday) {
        $('main').classList.add('birthday');
        $('headline').textContent = 'FELIZ ANIVERSÁRIO';
        $('status').textContent = 'HOJE É O SEU DIA';
        $('days').textContent = '13'; $('hours').textContent = '12';
        $('minutes').textContent = '13'; $('seconds').textContent = pad(now.getSeconds());
        $('progressLabel').textContent = 'MODO ANIVERSÁRIO ATIVADO';
        $('percent').textContent = '100%'; $('bar').style.width = '100%';
        $('footer').textContent = 'APROVEITE CADA SEGUNDO DESTE DIA';
        document.title = 'Feliz Aniversário!';
        return;
      }
      $('main').classList.remove('birthday');
      let target = new Date(now.getFullYear(), 11, 13, 0, 0, 0, 0);
      if (now >= target) target = new Date(now.getFullYear() + 1, 11, 13, 0, 0, 0, 0);
      const diff = target - now;
      const d = Math.floor(diff / 86400000);
      const h = Math.floor(diff % 86400000 / 3600000);
      const m = Math.floor(diff % 3600000 / 60000);
      const s = Math.floor(diff % 60000 / 1000);
      $('headline').textContent = 'CONTAGEM';
      $('status').textContent = 'FALTA';
      $('days').textContent = pad(d); $('hours').textContent = pad(h);
      $('minutes').textContent = pad(m); $('seconds').textContent = pad(s);
      const yearStart = new Date(now.getFullYear(), 11, 13);
      const nextYear = new Date(now.getFullYear() + 1, 11, 13);
      const cycleStart = now < yearStart ? new Date(now.getFullYear() - 1, 11, 13) : yearStart;
      const elapsed = now - cycleStart, total = nextYear - cycleStart;
      const pct = Math.max(0, Math.min(99.9, elapsed / total * 100));
      $('progressLabel').textContent = 'PROGRESSO DO CICLO';
      $('percent').textContent = Math.floor(pct) + '%'; $('bar').style.width = pct + '%';
      $('footer').textContent = 'O TEMPO NÃO ESPERA NINGUÉM';
      document.title = `${d} dias · Contagem`;
    }
    update();
    setInterval(update, 1000);
    video.play().catch(() => {});
  </script>
</body>
</html>
